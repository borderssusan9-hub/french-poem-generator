<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/typewriter-effect@3/dist/core.js"></script>
    <link rel="stylesheet" href="src/style.css"/>
    <title>AI French Poem Generator</title>
</head>
<body>
    <div class="container">
    <header>
<h1>AI French Poem Generator</h1>
    </header>
    
    <main>
        <form id="poem-generator-form">
            <input type="text" placeholder="Enter a topic for your French poem" 
            autofocus required autocomplete="off" class="instructions"/>
        <input type="submit" class="submit-button" />
        </form>
        <div class="poem" id="poem-output"></div>

    </main>
    <footer>This AI project was coded by <a href="https://github.com/borderssusan9-hub" target="_blank">Susan Borders</a> and 
        is 
        <a href="https://github.com/borderssusan9-hub/french-poem-generator" target="_blank">open-sourced on GitHub</a> and is <a href="https://ai-french-poem-generator3333.netlify.app/" target="_blank">hosted on Netlify.</a>
    </footer>
    </div>
    
    <script src="src/script.js"></script>
</body>
</html>
